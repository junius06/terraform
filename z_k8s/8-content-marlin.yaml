apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-marlin
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.24
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: content-marlin-svc
spec:
  selector:
    app: nginx
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: content-marlin-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: content-marlin.local
    http:
      paths:
      - path: /content-marlin
        pathType: Prefix
        backend:
          service:
            name: content-marlin-svc
            port:
              number: 8080