######################################
# IAM Role
######################################
iam_role: ""

######################################
# Network
######################################
subnet_groups:
  - "obs"

######################################
# Instance
######################################
instance_types:
  - "m7g.large"

ami_type: "AL2023_ARM_64_STANDARD"
capacity_type: "ON_DEMAND"

disk_size: 50

######################################
# Scaling
######################################
scaling:
  desired_size: 3
  min_size: 3
  max_size: 5

max_unavailable: 1

######################################
# Kubernetes Labels
######################################
labels:
  workload: "obs"

######################################
# Kubernetes Taints
######################################
taints: 
  role: obs

######################################
# Tags
######################################
tags:
  GBL_CLASS_0: "fmm"