######################################
# IAM Role
######################################
iam_role: ""

######################################
# Network
######################################
subnet_groups:
  - "kpt"

######################################
# Instance
######################################
instance_types:
  - "t4g.large"

ami_type: "AL2023_ARM_64_STANDARD"
capacity_type: "ON_DEMAND"

disk_size: 50

######################################
# Scaling
######################################
scaling:
  desired_size: 3
  min_size: 3
  max_size: 5

max_unavailable: 1

######################################
# Kubernetes Labels
######################################
labels:
  workload: "kpt"

######################################
# Kubernetes Taints
######################################
# taints 미사용
## taints: {} # List
taints: 
  - key: "role"
    value: "kpt"
    effect: "NO_SCHEDULE"

######################################
# Tags
######################################
tags:
  GBL_CLASS_0: "fmm"