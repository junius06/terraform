######################################
# EKS Cluster
######################################
version: "1.37"

vpc: "main"

subnet_groups:
  - "clster"

security_groups:
  - "eks-cluster"

iam_role: "eks-cluster"

endpoint_private_access: true
endpoint_public_access: false

enabled_cluster_log_types:
  - "api"
  - "audit"
  - "authenticator"
  - "controllerManager"
  - "scheduler"

authentication_mode: "API_AND_CONFIG_MAP"

bootstrap_cluster_creator_admin_permissions: false

deletion_protection: true

######################################
# EKS Managed Node Groups
######################################
node_groups:
  # eks/node_groups/ 경로에 아래 값의 yaml파일이 존재하지 않을 경우 Error 발생
  - "obs"
  - "kpt"

######################################
# EKS Cluster Tags
######################################
tags:
  GBL_CLASS_0: "fmm"
  GBL_CLASS_1: "eks"