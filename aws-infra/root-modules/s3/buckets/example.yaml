######################################
# 객체 소유권 (ACL비활성화/활성화)
######################################
object_ownership: BucketOwnerEnforced # 기본값: BucketOwnerEnforced
# BucketOwnerEnforced   # ACL 비활성화  (객체 소유권: 버킷 소유자 적용)
# BucketOwnerPreferred  # ACL 활성화    (객체 소유권: 버킷 소유자 선호)
# ObjectWriter          # ACL 활성화    (객체 소유권: 객체 라이터)


######################################
# Bucket Deletion
######################################
force_destroy: false # 기본값: false
# true:  terraform destroy 시 객체가 존재하더라도 Bucket 삭제 허용
# false: 객체가 존재하면 Bucket 삭제 실패


######################################
# Public Access 차단 설정 (ACLs)
######################################
block_all_public_access: true
# true  : 아래 개별 Public Access 설정과 관계없이 모두 true로 적용
# false : 아래 4개의 개별 설정값을 적용

block_public_acls: true
ignore_public_acls: true
block_public_policy: true
restrict_public_buckets: true


######################################
# Versioning
######################################
versioning_enabled: false # 기본값: false


######################################
# Server Side Encryption
######################################
encryption_type: AES256 # 기본값: AES256
# Supported values:
#   AES256       : SSE-S3
#   aws:kms      : SSE-KMS
#   aws:kms:dsse : DSSE-KMS

# encryption_type 값이 aws:kms 또는 aws:kms:dsse 일 때에만 지원
kms_key_arn: null # 기본값: null

# encryption_type 값이 aws:kms 때에만 적용
bucket_key_enabled: true


######################################
# Lifecycle
######################################
lifecycle:
  enabled: true

  rules:
    lifecycle_rule_name:  # 생명 주기 규칙 이름
      enabled: false  # false: 해당 LifeCycle Rule 미생성

    retention:
      enabled: true

      #####################
      # 규칙 범위 선택
      #####################
      scope: 
        # all    : 버킷의 모든 객체에 적용
        # filter : 하나 이상의 필터를 사용하여 이 규칙의 범위 제한
        # type: all
        type: 
          filter:
            prefix: null  # Optional: 특정 Prefix에만 Lifecycle을 적용할 경우 사용
            object_min: 
              enabled: false
              value: 1024 # 활성화 시 적용
              unit: B # B, KB, MB, GB
            object_max: 
              enabled: false
              value: 2024 # 활성화 시 적용
              unit: B # B, KB, MB, GB
            tags:
              enabled: false
              key1: value1
              key2: value2

      #####################
      # 수명 주기 규칙 작업
      #####################
      ## 스토리지 클래스 간에 객체의 현재 버전 전환
      current_version_transition:
        enabled: false

        rules:
          - days: 180
            storage_class: STANDARD_IA

          - days: 180
            storage_class: GLACIER_IR

      ## 스토리지 클래스 간에 객체의 이전 버전 전환
      noncurrent_version_transition:
        enabled: false

        rules:
          - noncurrent_days: 30
            storage_class: STANDARD_IA
            new_versoin_to_keep: null

          - noncurrent_days: 90
            storage_class: GLACIER_IR
            new_versoin_to_keep: null

      ## 객체의 현재 버전 만료
      current_version_expiration: 
        enabled: true
        days: 180

      ## 객체의 이전 버전 영구 삭제
      noncurrent_version_expiration: 
        enabled: false # 기본값: false
        days: 180
        new_versoin_to_keep: null
      # versioning_enabled = false 인데 이전 버전 만료 설정이 활성화되면 에러 메세지 발생

      ## 만료된 객체 삭제 마커 또는 완료되지 않은 멀티파트 업로드 삭제
      abort_incomplete_multipart_upload: 
        enabled: true
        만료된_객체_삭제_마커:
          enabled: true
        불완전_멀티파트_업로드_삭제:
          enabled: true
          days: 7


######################################
# Bucket Policy
######################################
bucket_policy: null
# null: Bucket Policy 미생성
# root-modules/s3/bucket_policies/<policy_name>.json.tftpl