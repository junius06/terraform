# Role Name:
# {project}-{environment}-{region_name}-eks-cluster-role

services:
  - "eks.amazonaws.com"

assume_role_actions:
  - "sts:AssumeRole"
  
instance_profile:
  enabled: false

aws_managed_policies:
  - "arn:aws:iam::aws:policy/AmazonEKSClusterPolicy"

custom_policies: {}

tags:
  Role: "EKS Cluster"