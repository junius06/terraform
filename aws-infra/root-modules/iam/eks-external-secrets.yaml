# Role Name:
# {project}-{environment}-{region_name}-eks-external-secrets-role

services:
  - "pods.eks.amazonaws.com"

assume_role_actions:
  - "sts:AssumeRole"
  - "sts:TagSession"

instance_profile:
  enabled: false

aws_managed_policies: []

custom_policies:
  # Policy Name:
  # {project}-{environment}-{region_name}-eks-external-secrets-pol
  policy:
    description: "Allow External Secrets Operator to read environment secrets"

    statements:
    #   - sid: "test"
    #     effect: "Allow"
    #     actions:
    #       - "secretsmanager:ListSecrets"
    #       - "secretsmanager:BatchGetSecretValue"
    #     resources:
    #       - "*"

      - sid: "ReadEnvironmentSecrets"
        effect: "Allow"
        actions:
          - "secretsmanager:GetSecretValue"
          - "secretsmanager:DescribeSecret"
          # - "secretsmanager:GetResourcePolicy"
          # - "secretsmanager:ListSecretVersionIds"
        resources:
          - "arn:aws:secretsmanager:{REGION}:{ACCOUNT_ID}:secret:dev-*"

tags:
  Role: "EKS External Secrets"