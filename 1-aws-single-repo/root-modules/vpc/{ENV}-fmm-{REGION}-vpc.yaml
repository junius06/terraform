########################
# Basic Example
########################
vpc_cidr                  : "10.205.0.0/19"
enable_dns_support        : "true"
enable_dns_hostnames      : "true"
public_nat_gateway_subnets : ["{environment}-{region_code}-sbn-ext-pub-a","{environment}-{region_code}-sbn-ext-pub-b"]
public_subnet:
- subnet_cidr: "10.205.0.0/24"
  tags:
    "Name": "{environment}-{region_code}-sbn-ext-pub-a"
- subnet_cidr: "10.205.1.0/24"
  tags:
    "Name": "{environment}-{region_code}-sbn-ext-pub-b"
- subnet_cidr: "10.205.2.0/24"
  tags:
    "Name": "{environment}-{region_code}-sbn-elb-pub-a"
    "kubernetes.io/role/elb": "1"
- subnet_cidr: "10.205.3.0/24"
  tags:
    "Name": "{environment}-{region_code}-sbn-elb-pub-b"
    "kubernetes.io/role/elb": "1"
private_subnet:
- subnet_cidr: "10.205.4.0/22"
  tags:
    "Name": "{environment}-{region_code}-sbn-eks-pri-a"
- subnet_cidr: "10.205.8.0/22"
  tags:
    "Name": "{environment}-{region_code}-sbn-eks-pri-b"
- subnet_cidr: "10.205.12.0/24"
  tags:
    "Name": "{environment}-{region_code}-sbn-elb-pri-a"
    "kubernetes.io/role/internal-elb": "1"
- subnet_cidr: "10.205.13.0/24"
  tags:
    "Name": "{environment}-{region_code}-sbn-elb-pri-b"
    "kubernetes.io/role/internal-elb": "1"
vpc_flow_log_s3_name : "{environment}-{region_code}-s3-vpcflow"

# 서브넷 잔여 IP 대역 10.205.12.0/22 / 10.205.16.0/20