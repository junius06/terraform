##################################
# s3
##################################
# 필수 태깅
#"SEC_ASSETS_PUBLIC": "N"
#"SEC_ASSETS_PII": "N"

s3_kms_arn: ""
s3_versioning: "Disabled"
s3_tags:
  "Name": "{environment}-{region_code}-s3-bucket-logging"
  "SEC_ASSETS_PUBLIC": "N"
  "SEC_ASSETS_PII": "N"
s3_object_lock: "Disabled"
s3_logging:
  s3_logging_target: "{environment}-{region_code}-s3-bucket-logging"
  s3_logging_target_prefix: "{environment}-{region_code}-s3-bucket-logging/"
  s3_logging_target_object_key_format: "simple_prefix"
  s3_logging_partitioned_prefix_type: ""
s3_lifecycle: []
s3_policy: {
  "Version": "2012-10-17",
  "Statement": [
    {
      "Effect": "Deny",
      "Principal": "*",
      "Action": "s3:GetObject",
      "Resource": [
        "arn:aws:s3:::{environment}-{region_code}-s3-bucket-logging",
        "arn:aws:s3:::{environment}-{region_code}-s3-bucket-logging/*"
      ],
      "Condition": {
        "Bool": {
          "aws:SecureTransport": "false"
        }
      }
    },
    {
      "Sid": "S3PolicyStmt-DO-NOT-MODIFY-1764227451907",
      "Effect": "Allow",
      "Principal": {
          "Service": "logging.s3.amazonaws.com"
      },
      "Action": "s3:PutObject",
      "Resource": "arn:aws:s3:::{environment}-{region_code}-s3-bucket-logging/*",
      "Condition": {
          "StringEquals": {
              "aws:SourceAccount": "1234567890"
          }
      }
    }
  ]
}